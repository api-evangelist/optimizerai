aid: optimizerai
name: OptimizerAI
description: >-
  OptimizerAI is an AI-powered sound effects (SFX) foundation model that
  generates unlimited, high-quality, royalty-free audio from text prompts or
  reference audio, built for game developers, video producers, filmmakers, and
  other creators. Its text-to-SFX v2 model produces studio-quality stereo
  output at 44.1 kHz up to 60 seconds long, with sound variations, style
  selection, and a "magic prompt" mode that interprets situational
  descriptions. OptimizerAI, Inc. offers a commercial API on tiered
  dedicated/shared plans with SLA guarantees, authenticated with a
  project-specific API key sent over an HTTPS header. The company is backed by
  Andreessen Horowitz (a16z).
